name: Edumax SaaS CI/CD & Reliability Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 🛡️ Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Ultra-Fast Static Analysis (oxlint)
        run: npm run lint

  test-suite:
    name: ⚡ Test Suite & 1M Scale Benchmarks (Node ${{ matrix.node-version }})
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Multi-Tenant RBAC Security Perimeter
        run: npm run test:rbac

      - name: Verify Concurrency Mutex & Race Condition Prevention
        run: npm run test:concurrency

      - name: Verify 1,000,000 Scale Engine & Throughput Benchmark
        run: npm run test:scale

      - name: Install Playwright Chromium Headless Engine
        run: npx playwright install --with-deps chromium

      - name: Execute End-to-End Persona Verification Suite
        run: npm run test:e2e

  build-and-bundle:
    name: 📦 Production Frontend Asset Compilation
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle (Vite)
        run: npm run build

      - name: Archive Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edumax-dist-bundle
          path: dist/
          retention-days: 7

  container-check:
    name: 🐳 Containerization Build & Health Verification
    needs: [test-suite, build-and-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Edumax Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: edumax-saas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
