# ==============================================================================
# EDUMAX SAAS — ENTERPRISE NGINX REVERSE PROXY & LOAD BALANCER CONFIGURATION
# Optimized for 1,000,000 Concurrent Users: Least-Conn, Microcaching, Gzip/Brotli, HTTP/2
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 1048576; # Support over 1M open file descriptors

events {
    worker_connections 65536;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning & Zero-Copy I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;

    # Buffer Optimization
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Microcache zone for sub-second read endpoint offloading
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edumax_cache:100m max_size=2g inactive=10m use_temp_path=off;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_rate_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:20m;

    # Gzip Compression Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Upstream Node.js API Cluster (Multi-Container Load Balancing)
    upstream edumax_cluster {
        least_conn; # Route to instance with fewest active connections
        server app_1:5001 max_fails=3 fail_timeout=10s;
        server app_2:5001 max_fails=3 fail_timeout=10s;
        server app_3:5001 max_fails=3 fail_timeout=10s;
        keepalive 512; # Persistent HTTP keepalive connections to upstreams
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static Client-Side Frontend (Immutable CDN Caching)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Static asset caching
            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # API & Microservices Proxy with Microcaching
        location /api/ {
            limit_req zone=api_rate_limit burst=50 nodelay;
            limit_conn addr_conn_limit 50;

            proxy_pass http://edumax_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Microcache read GET requests for 60 seconds
            proxy_cache edumax_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 302 60s;
            proxy_cache_valid 304 60s;
            proxy_cache_valid 404 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_bypass $http_cache_control $http_authorization;
            add_header X-Nginx-Cache-Status $upstream_cache_status;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Kubernetes & Load Balancer Health Check Probes
        location /health {
            proxy_pass http://edumax_cluster/health;
            access_log off;
        }

        # Prometheus Metrics Scraping Endpoint
        location /metrics {
            proxy_pass http://edumax_cluster/metrics;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }
    }
}
